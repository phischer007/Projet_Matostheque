services:
  db:
    image: postgres:17
    container_name: postgres-matos
    restart: always
    shm_size: 128mb 
    ports:
      - "5434:5432" 
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${DB_USER:-postgres} -d $${DB_NAME:-matostheque}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: django-matos-backend
    build: .
    container_name: backend-matos
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - assets:/app/assets
      - media:/app/media 
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`server_name.example.com`) && (PathPrefix(`/api/`) || PathPrefix(`/admin/`))"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls=true"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"
      - "traefik.http.routers.backend.middlewares=api-cors"

  frontend:
    image: django-matos-frontend
    build: 
      context: ./fronttheque
      dockerfile: Dockerfile
    container_name: frontend-matos
    restart: always
    env_file:
      - .env
    depends_on:
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`server_name.example.com`) && PathPrefix(`/matostheque`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls=true"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"

  static-server:
    image: nginx:alpine
    container_name: static-matos
    restart: always
    volumes:
      - assets:/app/assets:ro
      - media:/app/media:ro
      - ./nginx/nginx-static.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.static.rule=Host(`server_name.example.com`) && (PathPrefix(`/static/`) || PathPrefix(`/media/`))"
      - "traefik.http.routers.static.entrypoints=websecure"
      - "traefik.http.routers.static.tls=true"
      - "traefik.http.services.static.loadbalancer.server.port=80"

  traefik:
    image: traefik:v3.0
    container_name: traefik-matos
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik-tls.yml:/etc/traefik/dynamic/tls.yml:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
    labels:
      - "traefik.enable=true"
      # Global CORS middleware definition based on your NGINX config
      - "traefik.http.middlewares.api-cors.headers.accesscontrolallowmethods=GET, POST, OPTIONS"
      - "traefik.http.middlewares.api-cors.headers.accesscontrolalloworiginlist=*"
      - "traefik.http.middlewares.api-cors.headers.accesscontrolallowheaders=Origin, Content-Type, Accept, Authorization"

volumes:
  postgres_data:
  assets:
  media: