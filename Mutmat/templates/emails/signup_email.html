<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Template</title>
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
        }
        .container {
            background-color: #f5f5f5;
            padding: 20px;
        }
        h2 {
            color: #333;
        }
        p {
            color: #666;
        }
        .button {
            background-color: #007bff;
            color: #ffffff;
            padding: 10px 20px;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Welcome to the Mutmat Family!</h2>
        <p>Hi {{ user.first_name }},</p>
        <p>Thank you for signing up for our service. We're excited to have you on board.</p>
        <p>Happy Browsing!</p>
        <p><em>If you did not sign up for our service, please ignore this email.</em></p>
        <p>Thanks,<br>Team Mutmat</p>
    </div>

</body>
</html>
