events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 8001;
        server_name server_name.example.com;

        location / {
             return 301 https://$server_name.example.com$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name server_name.example.com;

        ssl_certificate /etc/nginx/ssl/server_name.example.com_fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/server_name.example.com.key;

        location /mutmat/ {
            proxy_pass http://front:3030;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_buffers 256 16k;
            proxy_buffer_size 16k;
            client_max_body_size 5M;
            client_body_timeout 60;
            send_timeout 300;
            lingering_timeout 5;
            proxy_connect_timeout 90;
            proxy_send_timeout 300;
            proxy_read_timeout 90s;
        }

        location /api/ {
            proxy_pass http://backend:8030;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-CSRFToken $cookie_csrftoken;

            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';
            add_header Access-Control-Allow-Headers 'Origin, Content-Type, Accept, Authorization';

            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin *;
                add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';
                add_header Access-Control-Allow-Headers 'Origin, Content-Type, Accept, Authorization';
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }
        }

        location /admin/ {
            proxy_pass http://backend:8030/admin/; 
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-CSRFToken $cookie_csrftoken;
        }

        location /static/ {
            alias /app/assets/;
        }

        location /media/ {
            alias /app/media/;
        }
    }
}